<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Meridian - Workforce Capability Engine</title>
    <style>
        :root { --primary: #1e3a8a; --secondary: #2563eb; --accent: #f59e0b; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }
        header { background-color: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 700; }
        header p { font-size: 12px; color: #93c5fd; }
        .badge-bumn { background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 14px; border-radius: 10px; border: 1px solid var(--border); }
        .stat-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-card .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
        .main-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .panel { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 16px; }
        .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .employee-card { border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .employee-card:hover, .employee-card.active { border-color: var(--secondary); background: #eff6ff; }
        .risk-tag { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
        .aha-card { background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%); border: 2px solid var(--secondary); border-radius: 10px; padding: 16px; margin-top: 12px; position: relative; }
        .aha-badge { position: absolute; top: 10px; right: 10px; background: var(--accent); color: #000; font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 10px; }
        .btn-action { width: 100%; background: var(--secondary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; margin-top: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Project Meridian — Capability Engine</h1>
            <p>BUMN Energy Talent Transformation</p>
        </div>
        <div class="badge-bumn">CONFIDENTIAL</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Pekerja Terdampak</div>
            <div class="value" style="color: var(--danger);">4,200</div>
        </div>
        <div class="stat-card">
            <div class="label">Mandat Kebijakan</div>
            <div class="value" style="color: var(--success);">0 Layoff</div>
        </div>
        <div class="stat-card">
            <div class="label">Target Waktu</div>
            <div class="value" style="color: var(--secondary);">90 Hari</div>
        </div>
        <div class="stat-card">
            <div class="label">Est. Penghematan</div>
            <div class="value" style="color: var(--primary);">Rp 437.5 M</div>
        </div>
    </div>

    <div class="main-content">
        <div class="panel">
            <div class="panel-title">Pilih Sampel Pegawai</div>
            <div id="employeeList"></div>
        </div>
        <div class="panel" id="detailPanel"></div>
    </div>

    <script>
        const employees = [
            { id: "EMP-48213", name: "Budi Santoso", tenure: "14 Tahun", role: "Field Metering Specialist", risk: "88%", skills: "Pemahaman Lapangan, Jaringan Lokal", target: "IoT Field Maintenance Specialist", match: "85%", time: "4 Minggu", savings: "Rp 120 Juta" },
            { id: "EMP-39102", name: "Siti Rahmawati", tenure: "9 Tahun", role: "Senior Meter Reader II", risk: "82%", skills: "Akurasi Data, Komunikasi Pelanggan", target: "Digital Energy Advisor", match: "88%", time: "3 Minggu", savings: "Rp 95 Juta" },
            { id: "EMP-51204", name: "Ahmad Hidayat", tenure: "18 Tahun", role: "Teknisi Pengawas Meteran", risk: "75%", skills: "Supervisi Lapangan, Audit K3", target: "Grid Asset Auditor & Supervisor", match: "92%", time: "2 Minggu", savings: "Rp 140 Juta" }
        ];

        function render() {
            const list = document.getElementById('employeeList');
            list.innerHTML = '';
            employees.forEach((emp, i) => {
                list.innerHTML += `
                    <div class="employee-card ${i===0?'active':''}" onclick="selectEmp(${i})">
                        <div style="font-weight:600; font-size:13px;">${emp.name}</div>
                        <div style="font-size:11px; color:#64748b;">${emp.role} • ${emp.tenure}</div>
                        <div style="margin-top:4px;"><span class="risk-tag">AI Risk: ${emp.risk}</span></div>
                    </div>`;
            });
            selectEmp(0);
        }

        function selectEmp(i) {
            document.querySelectorAll('.employee-card').forEach((c, idx) => c.classList.toggle('active', idx === i));
            const emp = employees[i];
            document.getElementById('detailPanel').innerHTML = `
                <div class="panel-title">Simulasi Peran Baru (ID: ${emp.id})</div>
                <h3 style="color:var(--primary);">${emp.name}</h3>
                <p style="font-size:12px; color:#64748b;">${emp.role}</p>
                <div class="aha-card">
                    <div class="aha-badge">Momen AHA!</div>
                    <div style="font-size:11px; color:#64748b;">Rekomendasi Jabatan Baru</div>
                    <div style="font-size:15px; font-weight:700; color:var(--primary); margin-top:2px;">${emp.target}</div>
                    <div style="margin-top:10px; font-size:12px;">
                        <div><strong>Match Rate:</strong> ${emp.match}</div>
                        <div><strong>Lama Reskilling:</strong> ${emp.time}</div>
                    </div>
                </div>
                <button class="btn-action" onclick="alert('Rekomendasi Disetujui!')">Disetujui untuk Reskilling</button>`;
        }
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
